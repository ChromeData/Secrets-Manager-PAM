<svg xmlns="http://www.w3.org/2000/svg" width="830" height="326" viewBox="0 0 830 326" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="13">
<rect width="830" height="326" rx="8" fill="#0d1117" stroke="#30363d"/>
<rect width="830" height="34" rx="8" fill="#161b22"/>
<rect y="26" width="830" height="8" fill="#161b22"/>
<circle cx="18" cy="17" r="5" fill="#ff5f56"/>
<circle cx="36" cy="17" r="5" fill="#ffbd2e"/>
<circle cx="54" cy="17" r="5" fill="#27c93f"/>
<text x="72" y="22" fill="#8b949e">secret + CMK + ViaService verified (LocalStack)</text>
<text x="16" y="54" fill="#8b949e" xml:space="preserve"># applied on LocalStack (no AWS account): secret + customer-managed KMS key</text>
<text x="16" y="74" fill="#8b949e" xml:space="preserve"># + rotation role all created, retrieval works end to end.</text>
<text x="16" y="114" fill="#c9d1d9" xml:space="preserve">secret:      lab05/database/app   (KmsKeyId set, RotationEnabled true)</text>
<text x="16" y="134" fill="#c9d1d9" xml:space="preserve">get-secret-value -&gt; {engine:postgres, host: lab-placeholder.local, password:****, username:...}</text>
<text x="16" y="174" fill="#c9d1d9" xml:space="preserve">kms key policy condition, VERIFIED:</text>
<text x="16" y="194" fill="#c9d1d9" xml:space="preserve">  AllowConsumerDecryptViaSecretsManagerOnly -&gt;</text>
<text x="16" y="214" fill="#c9d1d9" xml:space="preserve">    { &quot;kms:ViaService&quot;: &quot;secretsmanager.us-east-1.amazonaws.com&quot; }</text>
<text x="16" y="254" fill="#8b949e" xml:space="preserve"># NOT run on real AWS on purpose: a customer-managed KMS key (~$1/mo) and a</text>
<text x="16" y="274" fill="#8b949e" xml:space="preserve"># Secrets Manager secret (~$0.40/mo) are the core of this lab and both bill.</text>
<text x="16" y="294" fill="#8b949e" xml:space="preserve"># the CloudTrail audit half is LocalStack Pro. stated, not hidden.</text>
</svg>